name: Benchmarks

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "bench/**"
      - "crates/vass-*/src/**"
      - "Cargo.toml"
      - "Cargo.lock"

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo bench --package vass-bench --no-run
