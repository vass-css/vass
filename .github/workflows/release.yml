name: Release

# Triggers on version tags (v0.2.1, v1.0.0, ...) or manual run.
# Every release asset is checksummed and gets a free Sigstore build
# provenance attestation.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run tests
        run: cargo test --workspace --locked

  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    needs: validate
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            exe: vass
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            exe: vass.exe
    steps:
      - uses: actions/checkout@v7

      - name: Validate release version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node packaging/npm/scripts/check-version.js "$RELEASE_TAG"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }} --locked

      - name: Package (unix)
        if: runner.os != 'Windows'
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="manual-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          fi
          STAGE="vass-${VERSION}-${{ matrix.target }}"
          BINARY="vass-${{ matrix.target }}"
          mkdir "$STAGE"
          cp "target/${{ matrix.target }}/release/${{ matrix.exe }}" "$STAGE/"
          cp "target/${{ matrix.target }}/release/${{ matrix.exe }}" "$BINARY"
          cp README.md LICENSE "$STAGE/"
          zip -r "$STAGE.zip" "$STAGE"
          sha256sum "$STAGE.zip" "$BINARY" > "$STAGE.zip.sha256"

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $version = $env:GITHUB_REF_NAME -replace '^v',''
          } else {
            $version = "manual-$env:GITHUB_RUN_NUMBER-$env:GITHUB_RUN_ATTEMPT"
          }
          $stage = "vass-$version-${{ matrix.target }}"
          $binary = "vass-${{ matrix.target }}.exe"
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.exe }}" $stage
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.exe }}" $binary
          Copy-Item README.md $stage
          Copy-Item LICENSE $stage
          Compress-Archive -Path $stage -DestinationPath "$stage.zip"
          $zipHash = (Get-FileHash "$stage.zip" -Algorithm SHA256).Hash.ToLower()
          $binaryHash = (Get-FileHash $binary -Algorithm SHA256).Hash.ToLower()
          "$zipHash  $stage.zip`n$binaryHash  $binary" | Out-File -Encoding ascii "$stage.zip.sha256"

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.target }}
          path: |
            *.zip
            vass-${{ matrix.target }}*
            *.sha256
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    if: ${{ startsWith(github.ref, 'refs/tags/v') && !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download all packages
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Combine checksums into SHA256SUMS.txt
        run: |
          cd dist
          cat *.sha256 > SHA256SUMS.txt
          rm -f *.sha256
          sha256sum SHA256SUMS.txt > SHA256SUMS.txt.sha256
          cat SHA256SUMS.txt

      - name: Attest build provenance (free, Sigstore)
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/*.zip
            dist/vass-x86_64-unknown-linux-gnu
            dist/vass-x86_64-pc-windows-msvc.exe
            dist/SHA256SUMS.txt
            dist/SHA256SUMS.txt.sha256

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_args=()
          if [[ "${GITHUB_REF_NAME#v}" == *-* ]]; then
            release_args+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" \
            --title "Vass $GITHUB_REF_NAME" \
            --generate-notes \
            "${release_args[@]}" \
            dist/*
