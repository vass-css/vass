[workspace]
resolver = "2"
members = [
    "crates/vass-core",
    "crates/vass-parser",
    "crates/vass-evaluator",
    "crates/vass-transpiler",
    "crates/vass-embedded",
    "crates/vass-io",
    "crates/vass-plugins",
    "crates/vass-lsp",
    "crates/vass-wasm",
    "crates/vass-linter",
    "crates/vass-fmt",
    "bins/vass",
    "bins/vass-lsp-server",
    "bench",
    "tools/xtask",
]

[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.99"
authors = ["VASS Contributors"]
license = "Apache-2.0"
repository = "https://github.com/vass-css/vass"
description = "A modern CSS preprocessor written in Rust"
keywords = ["css", "preprocessor", "vcss", "web"]
categories = ["web-programming", "development-tools"]

[workspace.dependencies]
vass-core = { path = "crates/vass-core" }
vass-parser = { path = "crates/vass-parser" }
vass-evaluator = { path = "crates/vass-evaluator" }
vass-transpiler = { path = "crates/vass-transpiler" }
vass-embedded = { path = "crates/vass-embedded" }
vass-io = { path = "crates/vass-io" }
vass-plugins = { path = "crates/vass-plugins" }
vass-lsp = { path = "crates/vass-lsp" }
vass-wasm = { path = "crates/vass-wasm" }
vass-linter = { path = "crates/vass-linter" }
vass-fmt = { path = "crates/vass-fmt" }

thiserror = "1.0"
anyhow = "1.0"
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.0", features = ["derive"] }
clap_complete = "4.0"
indexmap = "2.0"
hashbrown = "0.17"
smallvec = "1.11"
smartstring = "1.0"
bitflags = "2.4"
cfg-if = "1.0"
once_cell = "1.18"
parking_lot = "0.12"
arc-swap = "1.6"

criterion = "0.5"
pretty_assertions = "1.4"
insta = "1.34"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
opt-level = "s"
overflow-checks = false

[profile.dev]
opt-level = 0
debug = true

[profile.test]
opt-level = 2
