[package]
name = "vass"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "VASS CSS preprocessor CLI"
keywords = ["css", "preprocessor", "cli"]
categories = ["command-line-utilities", "web-programming"]

[[bin]]
name = "vass"
path = "src/main.rs"

[dependencies]
vass-core.workspace = true
vass-parser.workspace = true
vass-evaluator.workspace = true
vass-transpiler.workspace = true
vass-io.workspace = true
vass-plugins.workspace = true
vass-lsp.workspace = true
clap.workspace = true
clap_complete.workspace = true
thiserror.workspace = true
anyhow.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
serde_json.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
pretty_assertions.workspace = true
tempfile = "3.8"
regex = "1"
